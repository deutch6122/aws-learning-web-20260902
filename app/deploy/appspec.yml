version: 0.0
os: linux
files:
  - source: ROOT.war
    destination: /opt/aws-learning-web/revision
  - source: db-scripts
    destination: /opt/aws-learning-web/scripts
file_exists_behavior: OVERWRITE
permissions:
  - object: /opt/aws-learning-web
    owner: root
    group: root
    mode: 755
    type:
      - directory
  - object: /opt/aws-learning-web/scripts
    owner: root
    group: root
    mode: 755
    type:
      - file
hooks:
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 180
      runas: root
  AfterInstall:
    - location: scripts/install_app.sh
      timeout: 300
      runas: root
    - location: scripts/after_install.sh
      timeout: 600
      runas: root
  ApplicationStart:
    - location: scripts/start_app.sh
      timeout: 180
      runas: root
  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 180
      runas: root
