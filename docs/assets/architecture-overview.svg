<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">AWS Learning Web architecture</title>
  <desc id="desc">User traffic flows through Route 53 and an Application Load Balancer to Apache and Tomcat on EC2, then to RDS MySQL. Tomcat retrieves database credentials from Secrets Manager. GitHub changes flow through CodePipeline, CodeBuild, and CodeDeploy.</desc>
  <defs>
    <style>
      .bg{fill:#f7f9fc}.group{fill:#fff;stroke:#cbd5e1;stroke-width:2}.aws{fill:#fff7ed;stroke:#f59e0b;stroke-width:2}.app{fill:#eff6ff;stroke:#3b82f6;stroke-width:2}.db{fill:#f5f3ff;stroke:#8b5cf6;stroke-width:2}.ops{fill:#ecfdf5;stroke:#10b981;stroke-width:2}.text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.title{font-size:24px;font-weight:700}.label{font-size:17px;font-weight:650}.small{font-size:14px;fill:#475569}.groupLabel{font-size:16px;font-weight:700;fill:#475569}.line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}.deploy{fill:none;stroke:#2563eb;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#blueArrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#64748b"/></marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#2563eb"/></marker>
  </defs>
  <rect class="bg" width="1200" height="690" rx="18"/>
  <text class="text title" x="50" y="48">AWS Learning Web — Architecture Overview</text>
  <text class="text small" x="50" y="74">Solid: user/application traffic   ·   Dashed blue: CI/CD deployment</text>

  <rect class="group" x="35" y="102" width="1130" height="342" rx="16"/>
  <text class="text groupLabel" x="58" y="132">APPLICATION PATH</text>

  <rect class="app" x="65" y="190" width="145" height="82" rx="12"/>
  <text class="text label" text-anchor="middle" x="137" y="224">User</text>
  <text class="text small" text-anchor="middle" x="137" y="249">Browser</text>

  <rect class="aws" x="260" y="190" width="150" height="82" rx="12"/>
  <text class="text label" text-anchor="middle" x="335" y="224">Route 53</text>
  <text class="text small" text-anchor="middle" x="335" y="249">DNS Alias</text>

  <rect class="aws" x="460" y="190" width="150" height="82" rx="12"/>
  <text class="text label" text-anchor="middle" x="535" y="224">ALB</text>
  <text class="text small" text-anchor="middle" x="535" y="249">Public Subnets</text>

  <rect class="app" x="660" y="168" width="205" height="126" rx="12"/>
  <text class="text label" text-anchor="middle" x="762" y="204">EC2 Auto Scaling</text>
  <text class="text small" text-anchor="middle" x="762" y="231">Private App Subnets</text>
  <text class="text small" text-anchor="middle" x="762" y="256">Apache → Tomcat</text>

  <rect class="db" x="930" y="190" width="185" height="82" rx="12"/>
  <text class="text label" text-anchor="middle" x="1022" y="224">RDS MySQL</text>
  <text class="text small" text-anchor="middle" x="1022" y="249">Private DB Subnets</text>

  <path class="line" d="M210 231h50"/><path class="line" d="M410 231h50"/><path class="line" d="M610 231h50"/><path class="line" d="M865 231h65"/>

  <rect class="ops" x="660" y="337" width="205" height="70" rx="12"/>
  <text class="text label" text-anchor="middle" x="762" y="366">Secrets Manager</text>
  <text class="text small" text-anchor="middle" x="762" y="389">DB credentials at runtime</text>
  <path class="line" d="M762 294v43"/>

  <rect class="group" x="35" y="470" width="1130" height="180" rx="16"/>
  <text class="text groupLabel" x="58" y="501">CI/CD PATH</text>

  <rect class="app" x="65" y="532" width="145" height="72" rx="12"/>
  <text class="text label" text-anchor="middle" x="137" y="561">Developer</text>
  <text class="text small" text-anchor="middle" x="137" y="583">git push</text>

  <rect class="app" x="260" y="532" width="150" height="72" rx="12"/>
  <text class="text label" text-anchor="middle" x="335" y="561">GitHub</text>
  <text class="text small" text-anchor="middle" x="335" y="583">main branch</text>

  <rect class="aws" x="460" y="532" width="150" height="72" rx="12"/>
  <text class="text label" text-anchor="middle" x="535" y="561">CodePipeline</text>
  <text class="text small" text-anchor="middle" x="535" y="583">Orchestration</text>

  <rect class="aws" x="660" y="532" width="205" height="72" rx="12"/>
  <text class="text label" text-anchor="middle" x="762" y="561">CodeBuild</text>
  <text class="text small" text-anchor="middle" x="762" y="583">Terraform / Maven</text>

  <rect class="aws" x="930" y="532" width="185" height="72" rx="12"/>
  <text class="text label" text-anchor="middle" x="1022" y="561">CodeDeploy</text>
  <text class="text small" text-anchor="middle" x="1022" y="583">AppSpec hooks</text>

  <path class="deploy" d="M210 568h50"/><path class="deploy" d="M410 568h50"/><path class="deploy" d="M610 568h50"/><path class="deploy" d="M865 568h65"/>
  <path class="deploy" d="M1022 532V420c0-34-28-61-62-61h-95"/>
</svg>
